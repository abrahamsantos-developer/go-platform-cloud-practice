services:
  app:
    build:
      context: ../..
      dockerfile: 01-docker/02_multistage/Dockerfile
    image: goose:compose
    depends_on:
      - postgres
      - redis
    environment:
      PORT: "8080"
      READY_DELAY_MS: "0"
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "18080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goose
      POSTGRES_PASSWORD: goose
      POSTGRES_DB: goose

  redis:
    image: redis:7-alpine
